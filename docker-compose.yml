services:
  mysql:
    image: mysql:lts
    container_name: runpure-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: runpure
      MYSQL_USER: runpure
      MYSQL_PASSWORD: runpure
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
