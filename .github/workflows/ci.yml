# Runs lint, typecheck and the full test suite on every pull request and push to main.
# The tests need a database: a throwaway MySQL 8.4 is built from sql/ in file order (ADR-0011).
name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: runpure_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      # A database that exists only for this job; not a real credential.
      TEST_DATABASE_URL: mysql://root:ci-only-password@127.0.0.1:3306/runpure_test
      DATABASE_URL: mysql://root:ci-only-password@127.0.0.1:3306/runpure_test
      AUTH_MODE: disabled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Build the schema from sql/ in order
        run: |
          for file in sql/0*.sql; do
            echo "applying $file"
            mysql -h 127.0.0.1 -uroot -pci-only-password runpure_test < "$file"
          done
      - run: npm test
      - name: Production dependency advisories (high and critical)
        run: npm audit --omit=dev --audit-level=high
